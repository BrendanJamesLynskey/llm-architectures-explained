# Models beyond the gallery checklist: the landmark history the gallery skips,
# and closed frontier models. Same keys as gallery.yaml, plus:
#   open: false          closed weights
#   no_arch: reason      no primary source gives the layer dimensions
#   estimates: [...]     third-party reported estimates; each names a source in
#                        `estimate_sources` below and is always shown labelled,
#                        and never used by the calculator unless the reader
#                        switches estimates on.

estimate_sources:
  medec-2024:
    publisher: "Ben Abacha, Yim, Fu, Sun, Yetisgen, Xia and Lin, MEDEC (arXiv 2412.19260v1)"
    url: "https://arxiv.org/abs/2412.19260"
    date: "2024-12-26"
    where: "§4 (p. 6): model sizes listed in the experiments section"
    confidence: >-
      Low. The authors write that the sizes are estimates mined from public
      articles, that they cannot vouch for their accuracy, and that they are
      given only to help place the results.

